<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basket Lab - Compare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- En-tête de la page -->
    <header class="compare-header">
        <a href="index.html" class="back-button">← ACCUEIL</a>
        <h1>COMPARE</h1>
        <p>Compare ta taille avec des légendes de la NBA.</p>
    </header>

    <main class="compare-page">

    <!-- Zone des contrôles -->
    <section class="compare-controls">

        <div class="control">
            <label for="user-height">👤 TA TAILLE</label>

            <div class="height-input">
                <input type="number" id="user-height" value="180" min="50" max="300">
                <span>cm</span>
            </div>
        </div>

        <div class="control">
            <label for="player-select">🏀 CHOISIS UN JOUEUR</label>

            <select id="player-select">
                <option value="wembanyama">Victor Wembanyama — 224 cm</option>
                <option value="shaq">Shaquille O'Neal — 216 cm</option>
                <option value="lebron">LeBron James — 206 cm</option>
                <option value="curry">Stephen Curry — 188 cm</option>
                <option value="bogues">Muggsy Bogues — 160 cm</option>
                <option value="bol">Manute Bol — 231 cm</option>
            </select>
        </div>

        <button id="compare-button">
            ↔ COMPARER
        </button>

    </section>


    <!-- Zone de comparaison -->
    <section class="height-comparison">

        <!-- Toi -->
        <div class="comparison-item">

            <div class="height-label user-label">180 cm</div>

            <div class="person user-person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arms"></div>
                <div class="legs"></div>
            </div>

            <div class="name-box">TOI</div>
            <p id="user-height-result">180 cm</p>

        </div>


        <!-- Panier -->
        <div class="comparison-item basket-item">

            <div class="basket-hoop">

                <div class="backboard">
                    <div class="backboard-square"></div>
                </div>

                <div class="rim"></div>
                <div class="net"></div>
                <div class="pole"></div>

            </div>

            <div class="basket-name">PANIER NBA</div>
            <p>305 cm</p>

        </div>


        <!-- Joueur -->
        <div class="comparison-item">

            <div class="height-label player-label">224 cm</div>

            <div class="person player-person">
                <div class="head"></div>
                <div class="body"></div>
                <div class="arms"></div>
                <div class="legs"></div>
            </div>

            <div class="name-box" id="player-name">VICTOR WEMBANYAMA</div>
            <p id="player-height-result">224 cm</p>

        </div>

    </section>

</main>

    <script src="script.js"></script>

</body>
</html>
